services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ${OBSIDIAN_HOST_VAULT_PATH:-./obsidian}:/vault
    environment:
      - PYTHONUNBUFFERED=1
      - OBSIDIAN_VAULT_PATH=/vault
    # Uncomment to co-locate with a local Ollama instance:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
