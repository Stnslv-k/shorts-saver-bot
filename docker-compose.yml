services:
  bot:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # Optional Obsidian mount. Match this with storage.obsidian.vault_path.
      # - ./obsidian:/vault
    environment:
      - PYTHONUNBUFFERED=1
    # Uncomment to co-locate with a local Ollama instance:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
